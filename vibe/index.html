<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Vibe Coding | Laugh</title>
  <link rel="icon" href="/favicon/favicon.ico">
  <meta name="author" content="Laugh Lin">
  <meta name="description" content="Vibe Coding 作品集：每一個都是真的拿來用過的。">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.6/css/bootstrap.min.css" integrity="sha384-rwoIResjU2yc3z8GV/NPeZWAv56rSmLldC3R/AZzGRnGxQQKnKkoFVhFQhNUwEyJ" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css?family=Crimson+Text|Open+Sans:300,800" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/vibe/vibe.css">
</head>

<body>
  <div class="container-fluid navbar-container m-sm-5">
    <nav class="navbar navbar-toggleable-sm navbar-light px-1 py-3 my-3 mb-sm-5">
      <a class="navbar-brand ml-2" href="/">Laugh</a>
      <button class="navbar-toggler navbar-toggler-right py-2" type="button" data-toggle="collapse" data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse text-center" id="navbarCollapse">
        <ul class="navbar-nav ml-auto my-auto">
          <li class="nav-item active"><a class="nav-link" href="/vibe/">Vibe Coding</a></li>
          <li class="nav-item"><a class="nav-link" href="/2022/08/09/about">About</a></li>
          <li class="nav-item"><a class="nav-link" target="_blank" rel="noopener" href="https://www.instagram.com/laughlaugh_sincere51/">Instagram</a></li>
          <li class="nav-item"><a class="nav-link" target="_blank" rel="noopener" href="https://www.linkedin.com/in/tinganlin-laughlaugh">LinkedIn</a></li>
          <li class="nav-item"><a class="nav-link" target="_blank" rel="noopener" href="https://www.facebook.com/lkkicecream/">Facebook</a></li>
        </ul>
        <hr class="hidden-md-up" />
      </div>
    </nav>

    <header class="vibe-header">
      <h1>Vibe Coding 作品集</h1>
      <p class="vibe-lead">Vibe coding 的人很多，這裡收的每一個都是真的拿來用過的。<br>有些任務完成就下架了，留下截圖和使用紀錄。</p>
      <p class="vibe-stats" id="vibe-stats"></p>
    </header>

    <div class="vibe-filters" id="vibe-filters"></div>

    <div class="row" id="vibe-grid"></div>
    <p class="vibe-empty" id="vibe-empty" hidden>這個條件底下還沒有作品。</p>
  </div>

  <dialog class="vibe-dialog" id="vibe-dialog" aria-labelledby="vibe-d-title">
    <button type="button" class="vibe-close" id="vibe-close" aria-label="關閉">×</button>
    <div id="vibe-detail"></div>
  </dialog>

  <script src="/vibe/projects.js"></script>
  <script>
  (function () {
    var projects = window.VIBE_PROJECTS || [];
    var $ = function (id) { return document.getElementById(id); };
    var grid = $('vibe-grid'), filters = $('vibe-filters'), empty = $('vibe-empty');
    var dialog = $('vibe-dialog'), detail = $('vibe-detail');
    var state = { type: '', category: '' };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function para(s) { return esc(s).replace(/\n/g, '<br>'); }
    function img(p, i) { return '/vibe/img/' + encodeURIComponent(p.id) + '/' + i.src; }
    function uniq(key) {
      var out = [];
      projects.forEach(function (p) { if (p[key] && out.indexOf(p[key]) === -1) out.push(p[key]); });
      return out;
    }
    function chips(list, cls) {
      return (list || []).map(function (t) { return '<span class="' + cls + '">' + esc(t) + '</span>'; }).join('');
    }

    // 統計
    if (projects.length) {
      var types = uniq('type');
      $('vibe-stats').textContent = '目前 ' + projects.length + ' 個作品' +
        (types.length ? '：' + types.map(function (t) {
          return t + ' ' + projects.filter(function (p) { return p.type === t; }).length;
        }).join('、') : '');
    }

    // 篩選列
    function filterRow(label, key, values) {
      if (values.length < 2) return '';
      return '<div class="vibe-filter-row" role="group" aria-label="' + label + '"><span class="vibe-filter-label">' + label + '</span>' +
        ['<button type="button" data-key="' + key + '" data-val="">全部</button>']
          .concat(values.map(function (v) { return '<button type="button" data-key="' + key + '" data-val="' + esc(v) + '">' + esc(v) + '</button>'; }))
          .join('') + '</div>';
    }
    filters.innerHTML = filterRow('類型', 'type', uniq('type')) + filterRow('分類', 'category', uniq('category'));
    filters.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      state[b.getAttribute('data-key')] = b.getAttribute('data-val');
      render();
    });

    function card(p, idx) {
      var cover = p.images && p.images.length
        ? '<img src="' + esc(img(p, p.images[0])) + '" alt="' + esc(p.title) + ' 截圖" loading="lazy">'
        : '<span class="vibe-noimg">' + esc(p.title) + '</span>';
      return '' +
        '<div class="col-lg-4 col-md-6 col-12 mb-4">' +
          '<button type="button" class="vibe-card" data-idx="' + idx + '">' +
            '<div class="vibe-cover">' + cover +
              (p.type ? '<span class="vibe-type">' + esc(p.type) + '</span>' : '') +
            '</div>' +
            '<div class="vibe-body">' +
              '<div class="vibe-meta">' + [p.category, p.period, p.status].filter(Boolean).map(esc).join(' · ') + '</div>' +
              '<h2 class="vibe-title">' + esc(p.title) + '</h2>' +
              '<p class="vibe-desc">' + esc(p.summary || '') + '</p>' +
              '<div class="vibe-stack">' + chips(p.stack, 'vibe-chip') + '</div>' +
            '</div>' +
          '</button>' +
        '</div>';
    }

    function render() {
      var list = [];
      projects.forEach(function (p, i) {
        if ((!state.type || p.type === state.type) && (!state.category || p.category === state.category)) list.push(card(p, i));
      });
      grid.innerHTML = list.join('');
      empty.hidden = list.length > 0 || projects.length === 0;
      Array.prototype.forEach.call(filters.querySelectorAll('button'), function (b) {
        var on = state[b.getAttribute('data-key')] === b.getAttribute('data-val');
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    function section(title, body) {
      return body ? '<section class="vibe-d-sec"><h3>' + title + '</h3>' + body + '</section>' : '';
    }

    function open(p) {
      var gallery = (p.images || []).map(function (i) {
        return '<figure><a href="' + esc(img(p, i)) + '" target="_blank" rel="noopener"><img src="' + esc(img(p, i)) + '" alt="' + esc(i.caption || p.title) + '" loading="lazy"></a>' +
          (i.caption ? '<figcaption>' + esc(i.caption) + '</figcaption>' : '') + '</figure>';
      }).join('');
      var links = (p.links || []).map(function (l) {
        return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + ' ↗</a>';
      }).join('');
      detail.innerHTML =
        '<div class="vibe-meta">' + [p.type, p.category, p.period, p.status].filter(Boolean).map(esc).join(' · ') + '</div>' +
        '<h2 class="vibe-d-title" id="vibe-d-title">' + esc(p.title) + '</h2>' +
        '<p class="vibe-d-summary">' + esc(p.summary || '') + '</p>' +
        (gallery ? '<div class="vibe-gallery">' + gallery + '</div>' : '') +
        section('為什麼做它', p.problem ? '<p>' + para(p.problem) + '</p>' : '') +
        section('實際使用', p.usage ? '<p>' + para(p.usage) + '</p>' : '') +
        section('怎麼做的', p.how ? '<p>' + para(p.how) + '</p>' : '') +
        section('語言與技術', p.stack && p.stack.length ? '<div class="vibe-stack">' + chips(p.stack, 'vibe-chip') + '</div>' : '') +
        (links ? '<div class="vibe-links">' + links + '</div>' : '');
      if (dialog.showModal) dialog.showModal(); else dialog.setAttribute('open', '');
      dialog.scrollTop = 0;
      if (history.replaceState) history.replaceState(null, '', '#' + p.id);
    }
    function close() {
      if (dialog.close) dialog.close(); else dialog.removeAttribute('open');
    }

    grid.addEventListener('click', function (e) {
      var c = e.target.closest('.vibe-card');
      if (c) open(projects[+c.getAttribute('data-idx')]);
    });
    $('vibe-close').addEventListener('click', close);
    dialog.addEventListener('click', function (e) { if (e.target === dialog) close(); });
    dialog.addEventListener('close', function () {
      if (history.replaceState) history.replaceState(null, '', location.pathname);
    });

    render();
    if (!projects.length) { empty.hidden = false; empty.textContent = '作品整理中，敬請期待。'; }

    // 支援 /vibe/#id 直接分享某個作品
    var hash = decodeURIComponent(location.hash.slice(1));
    if (hash) projects.forEach(function (p) { if (p.id === hash) open(p); });
  })();
  </script>

  <script src="https://code.jquery.com/jquery-3.1.1.slim.min.js" integrity="sha384-A7FZj7v+d/sdmMqp/nOQwliLvUsJfDHW+k9Omg/a/EheAdgtzNs3hpfag6Ed950n" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tether/1.4.0/js/tether.min.js" integrity="sha384-DztdAPBWPRXSA/3eYEEUWrWCy7G5KFbe8fFjk5JAIxUYHKkDx6Qin1DkWx51bBrb" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.6/js/bootstrap.min.js" integrity="sha384-vBWWzlZJ8ea9aCX4pEW3rVHjgjt7zpkNpZk+02D9phzyeVkE+jo0ieGizqPLForn" crossorigin="anonymous"></script>
</body>
</html>
